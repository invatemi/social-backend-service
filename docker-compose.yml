services:
  # ==================== API GATEWAY ====================
  krakend:
    image: devopsfaith/krakend:latest
    container_name: krakend
    ports: ["${KRAKEND_EXTERNAL_PORT:-8080}:${KRAKEND_PORT:-8080}"]
    volumes:
      - ./krakend/krakend.json:/etc/krakend/krakend.json:ro
    environment:
      JWT_SECRET: ${JWT_SECRET}
      KRAKEND_PORT: ${KRAKEND_PORT:-8080}
      FC_ENABLE: ${KRAKEND_FC_ENABLE:-1}
    depends_on:
      social-auth-service: { condition: service_healthy }
      social-user-service: { condition: service_healthy }
      social-post-service: { condition: service_healthy }
      social-message-service: { condition: service_healthy }
      social-notifications-service: { condition: service_healthy }
    networks: [social-net]
    restart: unless-stopped

  # ==================== MESSAGE BROKER ====================
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq
    ports:
      - "${RABBITMQ_AMQP_EXTERNAL_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_EXTERNAL_PORT:-15672}:${RABBITMQ_MANAGEMENT_PORT:-15672}"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/}
      RABBITMQ_MANAGEMENT_PORT: ${RABBITMQ_MANAGEMENT_PORT:-15672}
      RABBITMQ_MANAGEMENT_IP: ${RABBITMQ_MANAGEMENT_IP:-0.0.0.0}
      RABBITMQ_DEFINITIONS_FILE: ${RABBITMQ_DEFINITIONS_FILE:-/etc/rabbitmq/definitions.json}
      RABBITMQ_LOG_LEVEL: ${RABBITMQ_LOG_LEVEL:-info}
      RABBITMQ_VM_MEMORY_HIGH_WATERMARK: ${RABBITMQ_VM_MEMORY_HIGH_WATERMARK:-0.7}
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [social-net]
    restart: unless-stopped

  # ==================== REDIS ====================
  redis:
    image: redis:7-alpine
    container_name: redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1000"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - ${REDIS_MAXMEMORY_POLICY:-allkeys-lru}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [social-net]
    restart: unless-stopped

  # ==================== SERVICES ====================
  social-auth-service:
    build:
      context: ./services/auth-service
      args:
        SERVICE_PORT: ${AUTH_PORT}
    container_name: social-auth
    ports: ["3001:3001"]
    environment:
      PORT: ${AUTH_PORT}
      DB_HOST: ${AUTH_DB_HOST}
      DB_PORT: 5432
      DB_NAME: ${AUTH_DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@${AUTH_DB_HOST}:5432/${AUTH_DB_NAME}?schema=public"
    depends_on:
      auth-db: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const h=require('http');h.get('http://127.0.0.1:3001/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1)).setTimeout(2000,()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [social-net]

  social-user-service:
    build:
      context: ./services/user-service
      args:
        SERVICE_PORT: ${USER_PORT}
    container_name: social-user
    ports: ["3002:3002"]
    environment:
      PORT: ${USER_PORT}
      DB_HOST: ${USER_DB_HOST}
      DB_PORT: 5432
      DB_NAME: ${USER_DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@${USER_DB_HOST}:5432/${USER_DB_NAME}?schema=public"
      RABBITMQ_URL: "amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672"
      REDIS_URL: ${REDIS_URL}
      REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-5000}
      USER_CACHE_TTL_SECONDS: ${USER_CACHE_TTL_SECONDS:-300}
      USER_LIST_CACHE_TTL_SECONDS: ${USER_LIST_CACHE_TTL_SECONDS:-60}
    depends_on:
      user-db: { condition: service_started }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const h=require('http');h.get('http://127.0.0.1:3002/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1)).setTimeout(2000,()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [social-net]

  social-post-service:
    build:
      context: ./services/post-service
      args:
        SERVICE_PORT: ${POST_PORT}
    container_name: social-post
    ports: ["3003:3003"]
    environment:
      PORT: ${POST_PORT}
      DB_HOST: ${POST_DB_HOST}
      DB_PORT: 5432
      DB_NAME: ${POST_DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@${POST_DB_HOST}:5432/${POST_DB_NAME}?schema=public"
      RABBITMQ_URL: "amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672"
      REDIS_URL: ${REDIS_URL}
      REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-5000}
      POST_CACHE_TTL_SECONDS: ${POST_CACHE_TTL_SECONDS:-300}
      POST_LIST_CACHE_TTL_SECONDS: ${POST_LIST_CACHE_TTL_SECONDS:-60}
    depends_on:
      post-db: { condition: service_started }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const h=require('http');h.get('http://127.0.0.1:3003/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1)).setTimeout(2000,()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [social-net]

  social-message-service:
    build:
      context: ./services/message-service
      args:
        SERVICE_PORT: ${MSG_PORT}
    container_name: social-message
    ports: ["3004:3004"]
    environment:
      PORT: ${MSG_PORT}
      DB_HOST: ${MSG_DB_HOST}
      DB_PORT: 5432
      DB_NAME: ${MSG_DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@${MSG_DB_HOST}:5432/${MSG_DB_NAME}?schema=public"
    depends_on:
      msg-db: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const h=require('http');h.get('http://127.0.0.1:3004/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1)).setTimeout(2000,()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [social-net]

  social-notifications-service:
    build:
      context: ./services/notifications-service
      args:
        SERVICE_PORT: ${NOTIF_PORT}
    container_name: social-notifications
    ports: ["3005:3005"]
    environment:
      PORT: ${NOTIF_PORT}
      DB_HOST: ${NOTIF_DB_HOST}
      DB_PORT: 5432
      DB_NAME: ${NOTIF_DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@${NOTIF_DB_HOST}:5432/${NOTIF_DB_NAME}?schema=public"
      RABBITMQ_URL: "amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672"
    depends_on:
      notif-db: { condition: service_started }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const h=require('http');h.get('http://127.0.0.1:3005/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1)).setTimeout(2000,()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [social-net]

  # ==================== DATABASES ====================
  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [auth-data:/var/lib/postgresql/data]
    networks: [social-net]

  user-db:
    image: postgres:16-alpine
    container_name: users-db
    environment:
      POSTGRES_DB: ${USER_DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [user-data:/var/lib/postgresql/data]
    networks: [social-net]

  post-db:
    image: postgres:16-alpine
    container_name: posts-db
    environment:
      POSTGRES_DB: ${POST_DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [post-data:/var/lib/postgresql/data]
    networks: [social-net]

  msg-db:
    image: postgres:16-alpine
    container_name: messages-db
    environment:
      POSTGRES_DB: ${MSG_DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [msg-data:/var/lib/postgresql/data]
    networks: [social-net]

  notif-db:
    image: postgres:16-alpine
    container_name: notifications-db
    environment:
      POSTGRES_DB: ${NOTIF_DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [notif-data:/var/lib/postgresql/data]
    networks: [social-net]

volumes:
  auth-data:
  user-data:
  post-data:
  msg-data:
  notif-data:
  rabbitmq-data:
  redis-data:

networks:
  social-net:
    driver: bridge