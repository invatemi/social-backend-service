services:
  krakend:
    image: devopsfaith/krakend:2.7
    container_name: krakend
    ports:
      - "${KRAKEND_EXTERNAL_PORT:-8080}:${KRAKEND_PORT:-8080}"
    volumes:
      - ./krakend:/etc/krakend:ro
    environment:
      JWT_SECRET: ${JWT_SECRET}
      KRAKEND_PORT: ${KRAKEND_PORT:-8080}
      FC_ENABLE: "1"
      FC_PARTIALS: "/etc/krakend/partials"
      FC_OUT: "/tmp/krakend.json"
    command: ["run", "-c", "/etc/krakend/krakend.tmpl"]
    depends_on:
      social-auth-service: { condition: service_healthy }
      social-user-service: { condition: service_healthy }
      social-post-service: { condition: service_healthy }
      social-message-service: { condition: service_healthy }
      social-notifications-service: { condition: service_healthy }
    networks: [social-net]
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/}
      RABBITMQ_MANAGEMENT_PORT: ${RABBITMQ_MANAGEMENT_PORT:-15672}
      RABBITMQ_MANAGEMENT_IP: ${RABBITMQ_MANAGEMENT_IP:-127.0.0.1}
      RABBITMQ_DEFINITIONS_FILE: ${RABBITMQ_DEFINITIONS_FILE:-/etc/rabbitmq/definitions.json}
      RABBITMQ_LOG_LEVEL: ${RABBITMQ_LOG_LEVEL:-info}
      RABBITMQ_MEMORY_HIGH_WATERMARK: ${RABBITMQ_MEMORY_HIGH_WATERMARK:-0.6}
      RABBITMQ_DISK_FREE_LIMIT: ${RABBITMQ_DISK_FREE_LIMIT:-2GB}
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [social-net]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1000"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - ${REDIS_MAXMEMORY_POLICY:-allkeys-lru}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [social-net]
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_EXTERNAL_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_EXTERNAL_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [social-net]
    restart: unless-stopped

  minio-create-bucket:
    image: minio/mc:latest
    container_name: minio-create-bucket
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-minioadmin} ${S3_SECRET_ACCESS_KEY:-minioadmin};
      mc mb --ignore-existing local/${S3_BUCKET:-social-avatars};
      mc anonymous set download local/${S3_BUCKET:-social-avatars};
      "
    networks: [social-net]
    restart: "no"

  social-auth-service:
    build:
      context: ./services/auth-service
      args:
        SERVICE_PORT: ${AUTH_PORT:-3001}
    container_name: social-auth
    environment:
      PORT: ${AUTH_PORT:-3001}
      DB_HOST: ${AUTH_DB_HOST:-auth-db}
      DB_PORT: 5432
      DB_NAME: ${AUTH_DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@${AUTH_DB_HOST:-auth-db}:5432/${AUTH_DB_NAME}?schema=public"
      RABBITMQ_URL: "amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672"
    depends_on:
      auth-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const h=require('http');const p=process.env.PORT||3001;const r=h.get('http://127.0.0.1:'+p+'/health',res=>process.exit(res.statusCode===200?0:1));r.on('error',()=>process.exit(1));r.setTimeout(2000,()=>process.exit(1));\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [social-net]
    restart: unless-stopped

  social-user-service:
    build:
      context: ./services/user-service
      args:
        SERVICE_PORT: ${USER_PORT:-3002}
    container_name: social-user
    environment:
      PORT: ${USER_PORT:-3002}
      DB_HOST: ${USER_DB_HOST:-user-db}
      DB_PORT: 5432
      DB_NAME: ${USER_DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@${USER_DB_HOST:-user-db}:5432/${USER_DB_NAME}?schema=public"
      RABBITMQ_URL: "amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-5000}
      USER_CACHE_TTL_SECONDS: ${USER_CACHE_TTL_SECONDS:-300}
      USER_LIST_CACHE_TTL_SECONDS: ${USER_LIST_CACHE_TTL_SECONDS:-60}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-social-avatars}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-http://localhost:9000/social-avatars}
      S3_UPLOAD_URL_TTL_SECONDS: ${S3_UPLOAD_URL_TTL_SECONDS:-300}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    depends_on:
      user-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      minio-create-bucket: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const h=require('http');const p=process.env.PORT||3002;const r=h.get('http://127.0.0.1:'+p+'/health',res=>process.exit(res.statusCode===200?0:1));r.on('error',()=>process.exit(1));r.setTimeout(2000,()=>process.exit(1));\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [social-net]
    restart: unless-stopped

  social-post-service:
    build:
      context: ./services/post-service
      args:
        SERVICE_PORT: ${POST_PORT:-3003}
    container_name: social-post
    environment:
      PORT: ${POST_PORT:-3003}
      DB_HOST: ${POST_DB_HOST:-post-db}
      DB_PORT: 5432
      DB_NAME: ${POST_DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@${POST_DB_HOST:-post-db}:5432/${POST_DB_NAME}?schema=public"
      RABBITMQ_URL: "amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-5000}
      POST_CACHE_TTL_SECONDS: ${POST_CACHE_TTL_SECONDS:-300}
      POST_LIST_CACHE_TTL_SECONDS: ${POST_LIST_CACHE_TTL_SECONDS:-60}
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://social-user-service:3002}
      USER_SERVICE_TIMEOUT_MS: ${USER_SERVICE_TIMEOUT_MS:-3000}
    depends_on:
      post-db: { condition: service_healthy }
      social-user-service: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const h=require('http');const p=process.env.PORT||3003;const r=h.get('http://127.0.0.1:'+p+'/health',res=>process.exit(res.statusCode===200?0:1));r.on('error',()=>process.exit(1));r.setTimeout(2000,()=>process.exit(1));\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [social-net]
    restart: unless-stopped

  social-message-service:
    build:
      context: ./services/message-service
      args:
        SERVICE_PORT: ${MSG_PORT:-3004}
    container_name: social-message
    environment:
      PORT: ${MSG_PORT:-3004}
      DB_HOST: ${MSG_DB_HOST:-msg-db}
      DB_PORT: 5432
      DB_NAME: ${MSG_DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@${MSG_DB_HOST:-msg-db}:5432/${MSG_DB_NAME}?schema=public"
    depends_on:
      msg-db: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const h=require('http');const p=process.env.PORT||3004;const r=h.get('http://127.0.0.1:'+p+'/health',res=>process.exit(res.statusCode===200?0:1));r.on('error',()=>process.exit(1));r.setTimeout(2000,()=>process.exit(1));\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [social-net]
    restart: unless-stopped

  social-notifications-service:
    build:
      context: ./services/notifications-service
      args:
        SERVICE_PORT: ${NOTIF_PORT:-3005}
    container_name: social-notifications
    ports:
      - "${NOTIF_PORT:-3005}:${NOTIF_PORT:-3005}"
    environment:
      PORT: ${NOTIF_PORT:-3005}
      JWT_SECRET: ${JWT_SECRET}
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://social-user-service:3002}
      USER_SERVICE_TIMEOUT_MS: ${USER_SERVICE_TIMEOUT_MS:-3000}
      DB_HOST: ${NOTIF_DB_HOST:-notif-db}
      DB_PORT: 5432
      DB_NAME: ${NOTIF_DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@${NOTIF_DB_HOST:-notif-db}:5432/${NOTIF_DB_NAME}?schema=public"
      RABBITMQ_URL: "amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672"
    depends_on:
      notif-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      social-user-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const h=require('http');const p=process.env.PORT||3005;const r=h.get('http://127.0.0.1:'+p+'/health',res=>process.exit(res.statusCode===200?0:1));r.on('error',()=>process.exit(1));r.setTimeout(2000,()=>process.exit(1));\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [social-net]
    restart: unless-stopped

  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [auth-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${AUTH_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [social-net]
    restart: unless-stopped

  user-db:
    image: postgres:16-alpine
    container_name: users-db
    environment:
      POSTGRES_DB: ${USER_DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [user-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${USER_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [social-net]
    restart: unless-stopped

  post-db:
    image: postgres:16-alpine
    container_name: posts-db
    environment:
      POSTGRES_DB: ${POST_DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [post-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${POST_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [social-net]
    restart: unless-stopped

  msg-db:
    image: postgres:16-alpine
    container_name: messages-db
    environment:
      POSTGRES_DB: ${MSG_DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [msg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${MSG_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [social-net]
    restart: unless-stopped

  notif-db:
    image: postgres:16-alpine
    container_name: notifications-db
    environment:
      POSTGRES_DB: ${NOTIF_DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [notif-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${NOTIF_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [social-net]
    restart: unless-stopped

volumes:
  auth-data:
  user-data:
  post-data:
  msg-data:
  notif-data:
  rabbitmq-data:
  redis-data:
  minio-data:

networks:
  social-net:
    driver: bridge