# Включаем management plugin (Web UI на порту 15672)
management.tcp.port = $(RABBITMQ_MANAGEMENT_PORT)
management.tcp.ip = $(RABBITMQ_MANAGEMENT_IP)

# Загружаем предустановленные настройки (очереди, exchanges) при старте
load_definitions = $(RABBITMQ_DEFINITIONS_FILE)

# Логи
log.console = true
log.console.level = $(RABBITMQ_LOG_LEVEL)

# Ограничения памяти
vm_memory_high_watermark.relative = $(RABBITMQ_VM_MEMORY_HIGH_WATERMARK)